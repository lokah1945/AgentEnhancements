name: Bug report
description: Something in AgentEnhancements does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not report security vulnerabilities here; follow SECURITY.md.
        Never paste API keys or the contents of ui.api.json.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected versus actual behaviour.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. bash unified-integration/setup.sh
        2. ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, host agent(s) and versions, doctor output (redacted).
