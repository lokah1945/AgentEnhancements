name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks (CONTRACT §9.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify generated capability counts and current documentation claims
        run: python3 scripts/generate_capability_counts.py --check

      - name: Verify public repository description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}" --jq .description > "$RUNNER_TEMP/repository-description.txt"
          diff -u docs/repository-description.txt "$RUNNER_TEMP/repository-description.txt"

      - name: bash -n on all integration shell scripts
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash syntax check failed"
              status=1
            fi
          done < <(find unified-integration scripts -name '*.sh' -print0)
          exit $status

      - name: py_compile on all integration Python scripts
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! python3 -m py_compile "$f"; then
              echo "::error file=$f::python compile failed"
              status=1
            fi
          done < <(find unified-integration scripts -name '*.py' -print0)
          exit $status

      - name: JSON validity of the skills index and friends
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! python3 -m json.tool "$f" > /dev/null; then
              echo "::error file=$f::invalid JSON"
              status=1
            fi
          done < <(find unified-integration scripts plugin-catalog -name '*.json' \
                   -not -path '*/node_modules/*' -print0)
          # also validate the committed modular-tree index
          python3 -m json.tool skills/manifest.json > /dev/null || {
            echo "::error file=skills/manifest.json::invalid JSON"; exit 1; }
          exit $status

      - name: Filename policy (no temp/fixed/new/vN files in owned layer)
        run: |
          # R001 / §9.1: forbid *-fixed.*, *-new.*, *-vN.*, *.tmp.*, *.bak
          # Scoped to the owned integration layer and docs; vendored
          # projects keep their own upstream naming conventions.
          status=0
          while IFS= read -r f; do
            case "$f" in
              *-fixed.*|*-new.*|*-v[0-9]*.*|*.tmp.*|*.bak|*~)
                echo "::error file=$f::filename violates R001 (temp/fixed/new/versioned suffix)"
                status=1
                ;;
            esac
          done < <(git ls-files 'unified-integration/*.sh' 'unified-integration/*.py' \
                            'unified-integration/*.json' 'unified-integration/*.yaml' \
                            'unified-integration/*.md' 'docs/*.md' '.github/*.yml' '.github/**/*.yml')
          exit $status

      - name: Commit message policy (advisory)
        run: |
          # R201/R205/R206: conventional commits with agent traceability.
          # Advisory: human commits made directly by the maintainer do not
          # carry agent metadata, so this check warns instead of failing.
          # pull_request events carry no `before`; use the PR base instead.
          # --no-merges skips the synthetic refs/pull/N/merge commit.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # New branches (zero SHA) check the last 10 commits; unlike
          # HEAD~10..HEAD this also works on histories shorter than that.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD"; limit=10
          else
            range="$base..HEAD"; limit=50
          fi
          for sha in $(git rev-list --no-merges --max-count="$limit" "$range" 2>/dev/null); do
            subject=$(git log -1 --format=%s "$sha")
            body=$(git log -1 --format=%b "$sha")
            if ! echo "$subject" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+'; then
              echo "::warning file=COMMIT_EDITMSG::non-conventional subject: $subject"
            fi
            if ! echo "$body" | grep -q '^Agent: '; then
              echo "::warning file=COMMIT_EDITMSG::commit lacks 'Agent:' trailer (R206): $subject"
            fi
          done
          exit 0

  integration-tests:
    name: unified-integration test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOME: ${{ github.workspace }}/.agentenhancements/ci-home
      XDG_CONFIG_HOME: ${{ github.workspace }}/.agentenhancements/ci-home/.config
      XDG_DATA_HOME: ${{ github.workspace }}/.agentenhancements/ci-home/.local/share
      AGENT_MEMORY_ROOT: ${{ github.workspace }}/.agentenhancements/memory
      AGENT_ENHANCEMENTS_BUILD_HEADROOM: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare isolated HOME
        run: mkdir -p "$HOME" && chmod 700 "$HOME"
      - name: Install integration test command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep jq ffmpeg tesseract-ocr
      - name: Build modular skills tree (scaffold from catalog)
        run: |
          bash scripts/scaffold_modular_skills.sh
          python3 scripts/generate_skills_index.py
          git diff --exit-code -- skills/ || {
            echo "::error::committed skills index drifted from catalog.json - regenerate with scripts/generate_skills_index.py";
            exit 1; }
      - name: Build skill registry (also unskips the link-skills tests)
        run: bash unified-integration/setup.sh >/dev/null
      - name: Run regression suite
        run: |
          runtime_python="$(bash unified-integration/scripts/setup-mcp.sh --prepare)"
          # Fixtures create their own HOME; inherited host aliases would send
          # writes into the job's shared config directories instead.
          env -u CODEX_HOME -u CLAUDE_CONFIG_DIR -u HERMES_HOME \
            -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u XDG_CACHE_HOME \
            -u TASK_OBSERVER_WORKSPACE \
            "$runtime_python" unified-integration/tests/run-tests.py
      - name: Verify frozen bilingual discovery benchmark
        run: |
          runtime_python="$(bash unified-integration/scripts/setup-mcp.sh --prepare)"
          "$runtime_python" unified-integration/tests/discovery_benchmark.py --check \
            --output "${RUNNER_TEMP}/ae-discovery.json"

  headroom-cli:
    name: headroom CLI build and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      CARGO_HOME: ${{ github.workspace }}/.agentenhancements/cache/cargo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install tested Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Test standalone compression and every mode
        run: cargo test --manifest-path headroom/Cargo.toml --locked -p headroom-cli
      - name: Build the binary used by setup
        run: cargo build --manifest-path headroom/Cargo.toml --locked --release -p headroom-cli
      - name: Smoke test installed CLI interface
        run: |
          test -x headroom/target/release/headroom
          for mode in auto code logs json markdown generic; do
            printf '%s\n' '{"keep":null,"values":[1,2,3]}' |
              headroom/target/release/headroom compress --mode "$mode" > "$RUNNER_TEMP/headroom-$mode.txt"
            test -s "$RUNNER_TEMP/headroom-$mode.txt"
          done

  ecc-tests:
    name: ECC test suite (CONTRACT §5.1)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Install and verify ECC command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep jq
          rg --version
          printf 'ecc-pcre2-probe\n' | rg --pcre2 -- '^ecc-pcre2-probe$'
          jq --version
      - name: Install ECC dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ECC
      - name: Build opencode artifacts
        run: npm run build:opencode
        working-directory: ECC
      - name: Run ECC tests
        run: |
          # Follow ECC's own CI: suites that move shared build artifacts or
          # assert timing budgets must run outside the parallel worker pool.
          ECC_TEST_SERIAL=$(rg -l --glob '*.test.js' 'build-opencode|\.backup-|dist\.backup|time budget|real animator' tests | sed 's#^tests/##' | sort | paste -sd, -)
          export ECC_TEST_SERIAL
          ECC_TEST_JOBS=4 node tests/run-all.js
        working-directory: ECC

  mcp-servers:
    name: in-house MCP servers (health + tools)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg / tesseract for the media & vision servers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr
      - name: Prepare the canonical MCP runtime
        run: bash unified-integration/scripts/setup-mcp.sh --prepare
      - name: Health-check all built servers (checklist 4.4)
        run: bash unified-integration/scripts/setup-mcp.sh --check
      - name: Run the MCP regression module (offline mode)
        run: |
          runtime_python="$(bash unified-integration/scripts/setup-mcp.sh --prepare)"
          cd unified-integration
          "$runtime_python" - <<'PY'
          import unittest, sys
          sys.path.insert(0, "tests")
          from test_mcp_servers import TestMCPCatalog, TestEmbeddings, \
              TestTaskRouter, TestFfmpeg, TestVision, TestGraphRAG, \
              TestStyle, TestVideo, TestNetworkServers
          suite = unittest.TestSuite()
          for cls in (TestMCPCatalog, TestEmbeddings, TestTaskRouter,
                      TestFfmpeg, TestVision, TestGraphRAG, TestStyle,
                      TestVideo, TestNetworkServers):
              suite.addTests(unittest.defaultTestLoader.loadTestsFromTestCase(cls))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

      - name: Browser profile storage regressions (offline)
        run: npm --prefix mcp-servers/agent_browser test

  markdownlint:
    name: markdownlint (owned layer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Lint owned documentation
        run: |
          npx -y markdownlint-cli@0.49.1 \
            README.md README_INTEGRATION.md CONTRACT.md docs/*.md \
            unified-integration/skills/README.md skills/*.md skills/*/README.md
