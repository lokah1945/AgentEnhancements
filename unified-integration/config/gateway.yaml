# AgentEnhancements MCP Gateway Configuration

auto_start_priority: 1          # Auto-start servers with priority <= this (1=high, 2=medium, 3=low)
health_check_interval: 30       # Health check interval in seconds
default_timeout: 30             # Default tool call timeout in seconds
max_restarts: 3                 # Max restart attempts for failed servers
restart_delay: 5                # Delay between restarts in seconds

# Server-specific overrides (merged with catalog)
servers:
  filesystem-mcp:
    auto_start: true
    priority: 1
    health_check_interval: 15

  git-mcp:
    auto_start: true
    priority: 1
    health_check_interval: 30

  github-mcp:
    auto_start: false
    priority: 2
    health_check_interval: 60

  browser-mcp:
    auto_start: false
    priority: 2
    health_check_interval: 60

  web-search-mcp:
    auto_start: false
    priority: 2
    health_check_interval: 60