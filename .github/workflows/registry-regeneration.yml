name: Registry Regeneration

on:
  push:
    branches: ["**"]
    paths:
      - 'skills/**'
      - 'ECC/skills/**'
      - 'ponytail/skills/**'
      - 'superpowers/skills/**'
      - 'replica-skill/**'
      - 'task-observer/**'
      - 'unified-integration/setup.sh'
      - 'unified-integration/update-skills.sh'
      - 'scripts/generate_capability_counts.py'
      - '.github/workflows/registry-regeneration.yml'
      - 'plugin-catalog/**'
      - 'agentic-awesome-skills/skills/**'
      - 'anthropic-skills/skills/**'
      - 'agency-agents/skills/**'
      - 'unified-integration/scripts/build-library-map.py'
      - 'unified-integration/scripts/registry.py'
      - 'unified-integration/scripts/load-skills.py'
  pull_request:
    paths:
      - 'skills/**'
      - 'ECC/skills/**'
      - 'ponytail/skills/**'
      - 'superpowers/skills/**'
      - 'replica-skill/**'
      - 'task-observer/**'
      - 'unified-integration/setup.sh'
      - 'unified-integration/update-skills.sh'
      - 'scripts/generate_capability_counts.py'
      - '.github/workflows/registry-regeneration.yml'
      - 'plugin-catalog/**'
      - 'agentic-awesome-skills/skills/**'
      - 'anthropic-skills/skills/**'
      - 'agency-agents/skills/**'
      - 'unified-integration/scripts/build-library-map.py'
      - 'unified-integration/scripts/registry.py'
      - 'unified-integration/scripts/load-skills.py'
  workflow_dispatch:
  schedule:
    # Weekly on Monday 02:00 UTC
    - cron: '0 2 * * 1'

permissions:
  contents: read

jobs:
  regenerate-registry:
    name: Regenerate Skill Registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOME: ${{ github.workspace }}/.agentenhancements/ci-home
      XDG_CONFIG_HOME: ${{ github.workspace }}/.agentenhancements/ci-home/.config
      XDG_DATA_HOME: ${{ github.workspace }}/.agentenhancements/ci-home/.local/share
      AGENT_MEMORY_ROOT: ${{ github.workspace }}/.agentenhancements/memory
      AGENT_ENHANCEMENTS_BUILD_HEADROOM: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Prepare isolated HOME
        run: mkdir -p "$HOME" && chmod 700 "$HOME"

      - name: Build capability registry
        run: |
          # Refresh the skills index from vendored sources before building its consumers.
          bash unified-integration/setup.sh >/dev/null
          python3 unified-integration/scripts/registry.py build
          echo "agent-registry.json and all-skills.json regenerated"

      - name: Regenerate library map
        run: |
          # Must run AFTER registry.py build: build-library-map.py reads its
          # family counts from the agent-registry.json snapshot on disk, so
          # the old order left the L0 map one stage behind (audit 2026-11-19
          # §15; setup.sh already builds the registry first).
          python3 unified-integration/scripts/build-library-map.py
          echo "library-map.json regenerated"

      - name: Validate catalog
        run: |
          python3 unified-integration/scripts/catalog-validate.py

      - name: Verify generated capability counts
        run: python3 scripts/generate_capability_counts.py --check

      - name: Check for drift
        run: |
          if ! git diff --exit-code -- skills/library-map.json unified-integration/skills/agent-registry.json unified-integration/skills/all-skills.json; then
            echo "::error::Registry files have drifted. Commit the regenerated files."
            git diff -- skills/library-map.json unified-integration/skills/agent-registry.json unified-integration/skills/all-skills.json
            exit 1
          fi
          echo "No drift detected - registry is up to date"

      - name: Upload registry artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-files
          path: |
            skills/library-map.json
            unified-integration/skills/agent-registry.json
            unified-integration/skills/all-skills.json
          retention-days: 7
