# Weekly update proposals for the SHA-pinned actions and the owned lock files.
# Vendored upstream trees (headroom/, ECC/) are scanned by
# .github/workflows/dependency-audit.yml but deliberately left out here, so
# Dependabot never opens PRs that change upstream copies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /unified-integration
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /mcp-servers/agent_browser
    schedule:
      interval: weekly
