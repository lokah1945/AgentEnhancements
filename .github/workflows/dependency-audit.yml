name: Dependency audit

# Gating vulnerability scan of the locked dependency sets. Kept separate from
# ci.yml so an advisory published upstream cannot turn unrelated pushes red:
# it runs weekly, on demand, and whenever a lock file it scans changes.
# No step may end in `|| true`. An advisory in a vendored Cargo.lock that a
# semver-compatible patch fixes is cleared with
# `cargo update -p <crate> --precise <version>` in that lock (then
# `cargo test --locked` in the crate). Only an advisory with no compatible fix
# gets a documented `--ignore <ID>` next to the command that reports it.

on:
  push:
    branches: ["**"]
    paths:
      - 'unified-integration/requirements*.txt'
      - 'unified-integration/requirements.in'
      - 'mcp-servers/agent_browser/package*.json'
      - 'ECC/package-lock.json'
      - 'headroom/Cargo.lock'
      - 'ECC/ecc2/Cargo.lock'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    paths:
      - 'unified-integration/requirements*.txt'
      - 'unified-integration/requirements.in'
      - 'mcp-servers/agent_browser/package*.json'
      - 'ECC/package-lock.json'
      - 'headroom/Cargo.lock'
      - 'ECC/ecc2/Cargo.lock'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:
  schedule:
    # Weekly on Monday 03:00 UTC
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  python:
    name: pip-audit (runtime lock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pip-audit and uv
        run: python3 -m pip install --disable-pip-version-check pip-audit==2.10.1 uv==0.11.32
      - name: Check the lock matches requirements.in
        # Reruns the docs/UPDATING.md compile command, seeded with the
        # committed pins (hashes stripped, so uv recomputes every hash), and
        # fails on any difference. This catches lock edits that bypass that
        # command (hand edits, Dependabot's pip-compile rewrites): changed or
        # dropped hashes, non-universal markers, sdists, unresolved pins.
        run: |
          lock=unified-integration/requirements.txt
          sed -e '/--hash=/d' -e 's/ \\$//' "$lock" > "$RUNNER_TEMP/expected.txt"
          uv pip compile --quiet --universal --python-version 3.11 \
            --generate-hashes --only-binary :all: --no-header --no-annotate \
            --output-file "$RUNNER_TEMP/expected.txt" \
            unified-integration/requirements.in
          sed '/^#/d' "$lock" | sed '/./,$!d' > "$RUNNER_TEMP/committed.txt"
          diff -u "$RUNNER_TEMP/committed.txt" "$RUNNER_TEMP/expected.txt"
      - name: Audit unified-integration/requirements.txt
        # The lock is fully pinned with hashes, so pip-audit resolves it
        # without installing anything. The per-server requirements.txt files
        # under unified-integration/mcp-servers/ are unpinned ranges that the
        # runtime satisfies from this lock, so they are not audited separately.
        run: |
          pip-audit --progress-spinner off --require-hashes --disable-pip \
            -r unified-integration/requirements.txt

  node:
    name: npm audit (lock files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Audit agent_browser production dependencies
        run: npm audit --omit=dev --audit-level=high --package-lock-only
        working-directory: mcp-servers/agent_browser
      - name: Audit ECC dependencies
        run: npm audit --audit-level=high --package-lock-only
        working-directory: ECC

  rust:
    name: cargo audit (lock files)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install cargo-audit
        # >= 0.22 is required: older releases cannot parse the CVSS 4.0
        # vectors now present in the RustSec advisory database.
        run: cargo install cargo-audit --locked --version 0.23.0
      - name: Fetch RustSec advisory database
        run: |
          cargo audit --version
          cargo audit update-db
      - name: Audit headroom/Cargo.lock
        run: cargo audit --file headroom/Cargo.lock
      - name: Audit ECC/ecc2/Cargo.lock
        run: cargo audit --file ECC/ecc2/Cargo.lock
